# Un negocio de ejemplo. Copia esta carpeta entera para dar de alta otro:
#
#     cp -r negocios/peluqueria negocios/mi-negocio
#
# y cambia el nombre, tarifas.md y faq.md. No hay que tocar código.

nombre = "Peluquería"

# El saludo es opcional. Si no lo pones, se usa el genérico.
#
# OJO: pongas lo que pongas, al cargarlo se comprueba que avisa de que se
# habla con un sistema automático, y si no lo dice SE LE AÑADE. No es un
# descuido que se pueda cometer editando este fichero.
saludo = "Hola, ha llamado a la peluquería. Puedo darle precios y tomarle una cita."

despedida = "Gracias por llamar. ¡Hasta luego!"

# Horario de apertura. Con esto el agente RESERVA de verdad: comprueba que
# abrís ese día, que la hora cae dentro y que nadie tiene ya ese hueco. Si
# quitas esta sección, vuelve a «tomar nota» sin comprobar nada.
#
# Cada día es una lista de tramos "HH:MM-HH:MM". Lista vacía = cerrado.
[horario]
lunes = []
martes = ["10:00-14:00", "16:30-20:00"]
miercoles = ["10:00-14:00", "16:30-20:00"]
jueves = ["10:00-14:00", "16:30-20:00"]
viernes = ["10:00-14:00", "16:30-20:00"]
sabado = ["09:00-14:00"]
domingo = []
