<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NEGOCIO}}</title>
<style>
  :root { color-scheme: light dark; --fondo:#faf9f7; --texto:#1c1b19; --linea:#e2ded8;
          --mio:#e8f0fe; --suyo:#fff; --acento:#1a73e8; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#17161a; --texto:#e9e7e4; --linea:#2e2c33; --mio:#22314a; --suyo:#201f25; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--fondo); color:var(--texto); min-height:100dvh;
         display:flex; flex-direction:column; }
  header { padding:14px 16px; border-bottom:1px solid var(--linea); }
  header b { display:block; font-size:15px; }
  header small { opacity:.6; font-size:12px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(80%,42ch); padding:9px 13px; border-radius:16px; white-space:pre-wrap;
         word-wrap:break-word; }
  .suyo { background:var(--suyo); border:1px solid var(--linea); align-self:flex-start;
          border-bottom-left-radius:5px; }
  .mio { background:var(--mio); align-self:flex-end; border-bottom-right-radius:5px; }
  .nota { align-self:center; font-size:12.5px; opacity:.55; text-align:center; max-width:34ch; }
  footer { padding:12px 16px calc(12px + env(safe-area-inset-bottom));
           border-top:1px solid var(--linea); display:flex; gap:8px; align-items:center; }
  input { flex:1; min-width:0; padding:11px 14px; border-radius:22px; font:inherit;
          border:1px solid var(--linea); background:var(--suyo); color:inherit; }
  button { border:0; border-radius:22px; padding:11px 16px; font:inherit; font-weight:600;
           background:var(--acento); color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #mic.grabando { background:#d93025; }
</style>

<header>
  <b>{{NEGOCIO}}</b>
  <small id="modo"></small>
  <a href="/panel" style="font-size:12.5px">ver el día →</a>
</header>
<div id="chat"></div>
<footer>
  <input id="texto" placeholder="Escribe lo que dirías…" autocomplete="off">
  <button id="enviar">Enviar</button>
  <button id="mic" hidden>🎤</button>
  <button id="colgar" title="Colgar y empezar otra llamada">📞</button>
</footer>

<script>
const MODO = "{{MODO}}";
const chat = document.getElementById("chat");
const campo = document.getElementById("texto");
const enviar = document.getElementById("enviar");
const mic = document.getElementById("mic");
const colgar = document.getElementById("colgar");

function di(texto, clase) {
  const d = document.createElement("div");
  d.className = "msg " + clase;
  d.textContent = texto;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

di({{SALUDO_JSON}}, "suyo");

// El micrófono solo existe en contexto seguro: HTTPS o localhost. Por IP
// suelta el navegador lo bloquea, y no es un fallo nuestro.
const hayMicro = MODO === "voz" && window.isSecureContext
                 && navigator.mediaDevices?.getUserMedia;
document.getElementById("modo").textContent =
  MODO === "texto" ? "modo texto — arráncalo sin --sin-voz para hablar"
  : hayMicro ? "pulsa el micrófono y habla"
  : "el navegador no da micrófono sin HTTPS · usa: tailscale serve --bg 8080";
mic.hidden = !hayMicro;

async function mandar(cuerpo, tipo, loQueDije) {
  di(loQueDije, "mio");
  const esperando = di("…", "suyo");
  enviar.disabled = mic.disabled = true;
  const arranque = performance.now();
  try {
    const r = await fetch("/hablar", { method: "POST", headers: { "Content-Type": tipo }, body: cuerpo });
    const datos = await r.json();
    if (datos.oido && datos.oido !== loQueDije) {
      esperando.previousSibling.textContent = datos.oido;   // lo que de verdad se oyó
    }
    esperando.textContent = datos.dicho;
    const ms = Math.round(performance.now() - arranque);
    di(`${ms} ms`, "nota");
    if (datos.audio) sonar("data:audio/wav;base64," + datos.audio);
    if (datos.fin) {
      // La despedida cuelga, como en el teléfono. La siguiente frase es otra llamada.
      if (datos.colgado) di("apuntado: " + datos.colgado, "nota");
      di("— llamada terminada —", "nota");
      di({{SALUDO_JSON}}, "suyo");
    }
  } catch (e) {
    esperando.textContent = "No he podido contestar: " + e.message;
  } finally {
    enviar.disabled = mic.disabled = false;
    campo.focus();
  }
}

function mandarTexto() {
  const t = campo.value.trim();
  if (!t) return;
  campo.value = "";
  mandar(JSON.stringify({ texto: t }), "application/json", t);
}
enviar.onclick = mandarTexto;
campo.onkeydown = (e) => { if (e.key === "Enter") mandarTexto(); };

// En iOS el audio solo suena si el elemento se ha "desbloqueado" dentro de un
// gesto del usuario. Como la contestacion llega despues del fetch, el gesto ya
// paso y `new Audio(...).play()` se queda mudo sin dar error: el agente
// contesta y no se oye nada. Se reserva UN elemento y se desbloquea al primer
// toque; luego solo se le cambia el src.
const altavoz = new Audio();
let desbloqueado = false;
function desbloquear() {
  if (desbloqueado) return;
  desbloqueado = true;
  // Un wav de silencio minimo: basta para que iOS de por buena la reproduccion.
  altavoz.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9"
              + "AAACABAAZGF0YQAAAAA=";
  altavoz.play().catch(() => {});
}
function sonar(src) {
  altavoz.src = src;
  altavoz.play().catch(() => {});
}
document.addEventListener("pointerdown", desbloquear, { once: true });

// Safari en iOS NO graba webm: saca audio/mp4. Chrome y Firefox sacan webm.
// Hardcodear "audio/webm" mandaba un mp4 con etiqueta de webm.
function formatoGrabable() {
  const candidatos = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
  return candidatos.find((t) => MediaRecorder.isTypeSupported?.(t)) || "";
}

let grabadora = null;
mic.onclick = async () => {
  desbloquear();
  if (grabadora && grabadora.state === "recording") { grabadora.stop(); return; }
  const pista = await navigator.mediaDevices.getUserMedia({ audio: true });
  const trozos = [];
  const formato = formatoGrabable();
  grabadora = new MediaRecorder(pista, formato ? { mimeType: formato } : undefined);
  grabadora.ondataavailable = (e) => trozos.push(e.data);
  grabadora.onstop = () => {
    pista.getTracks().forEach((t) => t.stop());
    mic.classList.remove("grabando");
    mic.textContent = "🎤";
    // El tipo que de verdad eligio el navegador, no el que suponiamos.
    const tipo = (grabadora.mimeType || formato || "audio/webm").split(";")[0];
    mandar(new Blob(trozos, { type: tipo }), tipo, "🎤 …");
  };
  grabadora.start();
  mic.classList.add("grabando");
  mic.textContent = "⏹";
};
// Colgar cierra la llamada: apunta en que quedo y empieza otra de cero. Sin
// esto, la segunda prueba hereda la cita a medias de la primera.
colgar.onclick = async () => {
  try {
    const r = await fetch("/colgar", { method: "POST" });
    const datos = await r.json();
    if (datos.colgado) di("apuntado: " + datos.colgado, "nota");
  } catch (e) { /* colgar nunca debe romper la pagina */ }
  di("— llamada nueva —", "nota");
  di({{SALUDO_JSON}}, "suyo");
};

campo.focus();
</script>
