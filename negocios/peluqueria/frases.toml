[entiende]

# «vale» a secas NO va aquí: es la muletilla de «vale, pues nada, gracias» y
# se tomaba por «¿cuánto vale?». Con «cuanto» o «que» delante sí es un precio.
precio = ["precio", "precios", "cuanto", "cuesta", "cuestan", "cuanto vale",
          "cuanto valen", "que vale", "lo que vale", "tarifa", "tarifas",
          "cobrais", "cobran", "cobra", "sale", "me saldria",
          "cuanto me costaria", "que precio tiene", "es caro", "es barato",
          "me podeis decir el precio"]

# «¿Cuánto tarda?» se contesta con el servicio, su precio y lo que dura.
duracion = ["cuanto tarda", "cuanto dura", "cuanto tiempo", "cuanto se tarda",
            "tardais", "tarda mucho", "cuanto lleva"]

# Un saludo a secas: se le invita a hablar en vez de tomar nota.
saludo = ["hola", "buenas", "buenos dias", "buenas tardes", "buenas noches",
