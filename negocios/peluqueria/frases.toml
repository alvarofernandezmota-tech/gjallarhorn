# Lo que dice el agente y lo que entiende del cliente.
#
# TODO ESTE FICHERO ES OPCIONAL. Lo que no pongas aquí usa el valor de fábrica,
# así que puedes borrarlo entero y sigue funcionando, o dejar solo las dos
# líneas que quieras cambiar.
#
# Después de tocarlo, reinicia el servidor. Si te equivocas en algo, te lo dice
# al arrancar en vez de esperar a que llame alguien.

[dice]

pide_dia = "Muy bien, una cita{servicio}. ¿Qué día le viene bien?"
